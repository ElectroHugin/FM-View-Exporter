name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag, z. B. v0.0.1-erkundung.1 (leer = nur bauen)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Ein Release entsteht durch einen gepushten Tag v* oder durch einen manuellen Start mit release_tag.
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests
        run: dotnet test tests/FMViewExporter.Core.Tests -c Release

      - name: Plugin bauen
        run: dotnet build src/FMViewExporter -c Release

      - name: Pakete schnueren
        run: ./packaging/package.sh "${RELEASE_TAG:-dev-${{ github.run_number }}}"

      - uses: actions/upload-artifact@v4
        with:
          name: FMViewExporter-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: GitHub-Release
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: dist/release-notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
